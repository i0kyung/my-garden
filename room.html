<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 정원 · 키우기 정원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@400;500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#33433f;--sub:#62746f;--card:rgba(255,253,249,.9);--line:rgba(255,255,255,.75)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;
    background:linear-gradient(#d6f0e9,#86c1b5);user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  body.water #c{cursor:crosshair}

  #top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));pointer-events:none;z-index:5}
  #top h1{font-size:19px;font-weight:400}
  #top h1 small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
  .chip{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;
    color:var(--ink);text-decoration:none;font-family:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(30,60,55,.08)}

  /* 해 */
  #sunbar{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));width:260px;height:86px;transform:translateX(-50%);z-index:6;touch-action:none;cursor:grab}
  #sunbar svg{position:absolute;left:0;top:0;width:260px;height:62px;overflow:visible}
  #sun{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fffbe6,#ffd34d 60%,#ffb02e);box-shadow:0 0 0 6px rgba(255,220,120,.28),0 0 26px rgba(255,200,90,.7)}
  #sunLab{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:12px;color:var(--ink);opacity:.85;white-space:nowrap}
  @media (max-width:600px){ #sunbar{top:calc(max(8px,env(safe-area-inset-top)) + 46px);transform:translateX(-50%) scale(.85);transform-origin:top center} }

  /* 아래 도구 */
  #tools{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;z-index:6;
    background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 6px 24px rgba(30,60,55,.14)}
  #tools button,#tools a{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;padding:7px 8px;border:none;border-radius:16px;
    background:transparent;font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
  #tools span{font-size:22px;line-height:1}
  #tools button:active,#tools a:active{transform:scale(.95)}
  #tools .on{background:#5aa7d8;color:#fff}
  #tools em{font-style:normal;color:var(--sub);font-size:11px;margin-left:2px}
  #hint{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px);transform:translateX(-50%);font-size:13px;z-index:5;
    background:rgba(255,253,249,.75);padding:5px 12px;border-radius:999px;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;transition:opacity .3s}

  /* 말풍선 */
  #bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:7px 11px;font-size:13px;white-space:nowrap;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 4px 14px rgba(30,60,55,.12)}
  #bubble.show{opacity:1}
  #bubble b{font-weight:400;font-size:15px;margin-right:4px}
  #bubble span{color:var(--sub);font-size:12px}
  #bubble .mb{height:5px;border-radius:5px;background:#e3ece9;margin-top:5px;overflow:hidden}
  #bubble .mb i{display:block;height:100%;background:#5aa7d8;border-radius:5px}
  #bubble em{display:block;font-style:normal;font-size:12px;color:#3d82b8;margin-top:3px}

  #toast{position:fixed;left:50%;top:110px;transform:translate(-50%,-10px);opacity:0;background:rgba(51,67,63,.92);color:#fff;padding:9px 16px;
    border-radius:999px;font-size:14px;transition:all .3s;z-index:20;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .fx{position:fixed;pointer-events:none;z-index:8;font-size:20px;transition:transform 1.1s ease-out,opacity 1.1s ease-out}

  /* 도감 카드 */
  .card{background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column}
  .card .img{aspect-ratio:1;background-size:92% auto;background-position:center 60%;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center}
  .card .lab{padding:9px 11px 11px;font-family:'Helvetica Neue',Arial,'Gowun Dodum',sans-serif;line-height:1.3}
  .card .lab b{display:block;font-size:13px;letter-spacing:.02em;color:#222}
  .card .lab i{display:block;font-size:11px;color:#444;margin-top:1px}
  .card .lab span{display:block;font-family:'Gowun Dodum',sans-serif;font-size:13px;color:#222;margin-top:2px}
  .card .lab small{color:#d9a400;margin-left:4px;font-size:11px}
  .card .lab p{font-family:'Gowun Dodum',sans-serif;font-size:11px;color:#888;margin-top:2px}
  .card.lock .img{background:#e6e4dd}
  .card.lock .img span{font-size:40px;color:#c4c0b4;font-family:Arial,sans-serif}
  .card.lock .lab b,.card.lock .lab span{color:#aaa}
  .card.lock .lab small{color:#ccc}

  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,60,56,.35);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
  .modal.show{display:flex}
  #dex .box{background:#cfdcd6;border-radius:20px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  #dex .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
  #dex .hd h2{font-weight:400;font-size:20px}
  #dex .hd h2 small{font-size:13px;color:var(--sub);margin-left:6px}
  #dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding:8px 18px 22px;overflow:auto}
  @media (max-width:480px){ #dexGrid{grid-template-columns:repeat(2,1fr);gap:12px} }
  #reveal .box{background:#cfdcd6;border-radius:22px;padding:22px;width:min(300px,100%);text-align:center}
  #reveal h2{font-weight:400;font-size:18px;margin-bottom:14px;line-height:1.5}
  #reveal .card{text-align:left;transform:rotate(-2deg);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}}
  .btn{display:block;width:100%;margin-top:16px;border:none;border-radius:14px;padding:12px;font-family:inherit;font-size:15px;background:#4f7f5a;color:#fff;cursor:pointer}

  #infoCard .box{background:#fffaf3;border-radius:20px;padding:22px 22px 18px;width:min(320px,100%);text-align:center;line-height:1.6}
  #infoCard h3{font-weight:400;font-size:18px;margin-bottom:4px}
  #infoCard p{font-size:13px;color:var(--sub)}
  #infoCard .row{margin-top:14px;padding-top:12px;border-top:1px dashed #e2d8c8;font-size:14px}
  #infoCard a.insta{display:inline-block;margin-top:6px;color:#c45a7a;text-decoration:none;font-size:15px}
  #payLink{display:block;margin-top:10px;background:#ffe14d;color:#3c2f1f;border-radius:12px;padding:11px;text-decoration:none;font-size:14px}
  #closeInfo{background:#efe5d7;color:var(--ink);margin-top:14px}

  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:40;
    background:linear-gradient(#d6f0e9,#86c1b5);transition:opacity .6s}
  #err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;background:#d6f0e9;z-index:50;line-height:1.7}

  /* ---- 에디토리얼 타입 시스템 ---- */
  :root{--ink:#1c1f1d;--sub:#5f625c;--card:rgba(246,241,231,.95);--line:rgba(28,31,29,.14);--rose:#c4566f;--paper:#f4efe6}
  body{font-family:'Gowun Batang',serif;-webkit-font-smoothing:antialiased}
  #top h1 a{color:var(--ink);text-decoration:none;pointer-events:auto}
  #top h1{font-family:'Anton',sans-serif;font-weight:400;font-size:28px;line-height:.95;letter-spacing:.005em;text-transform:uppercase}
  #top h1 small{font-family:'Jost','Gowun Batang',sans-serif;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:.72;margin-top:7px;line-height:1.4}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;font-family:'Jost','Gowun Batang',sans-serif;font-size:12px;letter-spacing:.1em;color:var(--ink);box-shadow:none}
  .cap{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
  #toast{background:rgba(28,31,29,.92);font-family:'Gowun Batang',serif;border-radius:6px;font-size:14px}
  .btn,#gate #startCam,#intro button{background:var(--ink)!important;color:var(--paper)!important;font-family:'Jost','Gowun Batang',sans-serif!important;letter-spacing:.12em;border-radius:8px!important}
  .modal .box,#gate .box,#picker .box{background:var(--paper)!important}
  #infoCard h3,#gate h2{font-family:'Anton',sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;letter-spacing:.01em}
  #infoCard a.insta{color:var(--rose);font-family:'Jost',sans-serif;letter-spacing:.06em}
  #payLink{border-radius:8px!important}

  #sunLab{font-family:'Jost','Gowun Batang',sans-serif;font-size:11px;letter-spacing:.08em;color:var(--ink)}
  #tools{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;gap:2px;box-shadow:0 8px 30px rgba(28,31,29,.12)}
  #tools button,#tools a{border-radius:10px;min-width:74px;font-family:'Gowun Batang',serif;font-size:12.5px;gap:4px;padding:8px 8px 7px}
  #tools svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  #tools .on{background:var(--ink);color:var(--paper)}
  #tools em{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.06em;color:var(--rose)}
  #hint{font-family:'Gowun Batang',serif;background:var(--card);border:1px solid var(--line);font-size:12.5px}
  #bubble{font-family:'Gowun Batang',serif;border-radius:8px;border:1px solid var(--line);background:var(--card)}
  #bubble b{font-weight:700}
  #bubble .mb i{background:#3d82b8}
  #dex .hd h2{font-family:'Anton',sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;letter-spacing:.01em}
  #dex .hd h2 small{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.22em;color:var(--rose);margin-left:10px}
  #dex .hd p{font-family:'Gowun Batang',serif;font-size:12px;color:var(--sub);margin-top:2px}
  #reveal h2{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px}
  #reveal .cap{color:var(--rose);margin-bottom:6px}
  .card{border-radius:2px}
  .card .img,.card .lab{flex:none}
  #dexGrid{grid-auto-rows:max-content;align-content:start}
  .card .lab b{font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.14em;font-size:12px}
  .card .lab i{font-family:'Gowun Batang',serif}
  .card .lab span,.card .lab p{font-family:'Gowun Batang',serif}
  #loading{font-family:'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;font-size:12px;background:var(--paper)!important;color:var(--ink)}
  #loading b{font-family:'Anton',sans-serif;font-weight:400;font-size:46px;letter-spacing:.01em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><b>MY GARDEN</b>정원을 준비하는 중</div>
<div id="err"><div>이 페이지는 로컬 서버나 GitHub Pages에서 열어야 해요.</div></div>

<div id="top">
  <h1><a href="index.html">My Garden</a><small>01 — Grow · 키우기 정원</small></h1>
  <button class="chip" id="openInfo" title="만든 사람">Info</button>
</div>

<div id="sunbar" title="해를 끌어서 시간을 바꿔요">
  <svg viewBox="0 0 260 62"><path d="M14 56 Q130 -18 246 56" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/></svg>
  <div id="sun"></div>
  <div id="sunLab"></div>
</div>

<div id="hint"></div>
<div id="tools">
  <button id="tSeed"><svg viewBox="0 0 24 24"><path d="M12 3c4 3 6 7 6 10a6 6 0 0 1-12 0c0-3 2-7 6-10z"/><path d="M12 9v9"/></svg>씨앗 뿌리기</button>
  <button id="tWater"><svg viewBox="0 0 24 24"><path d="M4 10h11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M15 12l5-5"/><path d="M19 5l2 2"/><path d="M6 10a3.5 3.5 0 0 1 7 0"/></svg>물뿌리개</button>
  <button id="tDex"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6"/></svg><div>도감 <em id="dexCount"></em></div></button>
  <a id="tHand" href="garden.html"><svg viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10V4a1.5 1.5 0 0 1 3 0v7"/><path d="M14 10.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2.5-4a1.5 1.5 0 0 1 2.5-1.6L8 15"/></svg>손 정원</a>
</div>

<div id="bubble"></div>
<div id="toast"></div>

<div class="modal" id="dex"><div class="box">
  <div class="hd"><div><h2>Flower Index<small id="dexSub"></small></h2><p>피워낸 꽃이 한 장씩 모여요</p></div><button class="chip" id="dexClose">닫기</button></div>
  <div id="dexGrid"></div>
</div></div>

<div class="modal" id="reveal"><div class="box">
  <div class="cap" id="revealCap">New Flower</div><h2 id="revealTitle"></h2>
  <div id="revealCard"></div>

</div></div>

<div class="modal" id="infoCard"><div class="box">
  <h3>My Garden</h3>
  <p>만든 사람 · 민경</p>
  <div class="row">의견은 인스타 DM으로 주세요 💌<br><a class="insta" href="https://instagram.com/i0k.zip" target="_blank" rel="noopener">@i0k.zip</a></div>
  <div class="row">후원해 주시면 꽃이 더 많이 피어요 🌷<a id="payLink" href="https://qr.kakaopay.com/FZ946M6xm" target="_blank" rel="noopener">카카오페이로 후원하기</a></div>
  <button class="btn" id="closeInfo">닫기</button>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FLOWERS, byId, loadState, saveState, pickSeed } from './flowers-data.js';

const $ = id => document.getElementById(id);
if (location.protocol === 'file:') $('err').style.display = 'flex';
const FAST = new URLSearchParams(location.search).has('fast') ? 8 : 1; // ?fast : 테스트용 8배속
const BED_R = 1.45, SOIL_Y = 0.42, MAX_PLANTS = 30, PS = 1.35; // PS: 식물 크기
const STAGES = ['씨앗', '새싹', '줄기', '봉오리', '꽃'];
const stageOf = g => g < 0.1 ? 0 : g < 0.35 ? 1 : g < 0.7 ? 2 : g < 1 ? 3 : 4;
const clamp01 = v => Math.min(1, Math.max(0, v));

// ---------- 상태 ----------
const state = loadState();
let giftId = null;
if (state.gift) {
  giftId = state.gift; delete state.gift;
  state.plants.push({ uid: state.uid++, id: giftId, x: 0.1, z: 0.25, g: 1, m: 0.6 });
}
// 해 위치: 0 아침 · 0.5 한낮 · 1 저녁
function sunInfo(t) {
  const k = Math.sin(Math.PI * t);
  return { k, phase: t < 0.3 ? '아침' : t < 0.7 ? '한낮' : '저녁', grow: 0.65 + 0.35 * k, dry: 0.12 + 0.33 * k };
}
const GROW = 0.0035; // 촉촉할 때 1초에 자라는 양
function tick(p, sec, si) {
  if (sec <= 0) return;
  const dps = si.dry / 60 * FAST;
  const wet = Math.max(0, Math.min(sec, (p.m - 0.1) / dps));
  if (p.g < 1) p.g = Math.min(1, p.g + GROW * si.grow * FAST * wet);
  p.m = Math.max(0, p.m - dps * sec);
}
{ // 자리를 비운 동안의 시간
  const away = Math.min((Date.now() - (state.t || Date.now())) / 1000, 6 * 3600);
  const si = sunInfo(state.sun);
  state.plants.forEach(p => tick(p, away, si));
  state.t = Date.now(); saveState(state);
}

// ---------- 장면 ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#86c1b5', 7, 15);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 60);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enablePan: false, enableDamping: true, dampingFactor: 0.08, rotateSpeed: 0.6,
  minPolarAngle: 0.45, maxPolarAngle: 1.22, minAzimuthAngle: -0.9, maxAzimuthAngle: 0.9 });
controls.target.set(0, SOIL_Y + 0.22, 0);

const hemi = new THREE.HemisphereLight('#fffaf0', '#5f817b', 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2.4, right: 2.4, top: 2.4, bottom: -2.4, near: 0.5, far: 20 });
sun.shadow.bias = -0.0006; sun.shadow.radius = 3;
scene.add(sun, sun.target);

// 큰 화분 (밤하늘색 점무늬)
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
const potTex = canvasTex(512, 256, (x, w, h) => {
  x.fillStyle = '#2e3b57'; x.fillRect(0, 0, w, h); x.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 240; i++) { x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 2.2, 0, 7); x.fill(); }
}, 4, 1);
const potPts = [[0, -0.7], [1.3, -0.7], [1.34, -0.66], [1.58, 0.44], [1.62, 0.5], [1.6, 0.54], [1.5, 0.54], [1.49, 0.44]];
const pot = new THREE.Mesh(new THREE.LatheGeometry(potPts.map(([r, y]) => new THREE.Vector2(r, y)), 96),
  new THREE.MeshStandardMaterial({ map: potTex, roughness: 0.85, side: THREE.DoubleSide }));
pot.castShadow = pot.receiveShadow = true; scene.add(pot);
const soilTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#7d5c41'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) {
    x.fillStyle = Math.random() < 0.5 ? 'rgba(60,40,26,.18)' : 'rgba(170,135,100,.16)';
    x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 3 + Math.random() * 14, 0, 7); x.fill();
  }
}, 2, 2);
const soil = new THREE.Mesh(new THREE.CircleGeometry(1.5, 72), new THREE.MeshStandardMaterial({ map: soilTex, roughness: 1 }));
soil.rotation.x = -Math.PI / 2; soil.position.y = SOIL_Y; soil.receiveShadow = true; scene.add(soil);
{ // 자갈
  const n = 60, peb = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.03, 0),
    new THREE.MeshStandardMaterial({ color: '#a38a72', roughness: 1 }), n);

      o.plantG.position.y = o.fallY || 0;
    }
    o.wob = Math.max(0, o.wob - dt * 1.2);
    const thirsty = p.m < 0.06 && p.g < 1 && p.g >= 0.1;
    o.plantG.rotation.z = Math.sin(t * 1.3 + o.sd) * 0.02 + Math.sin(t * 14) * 0.14 * o.wob;
    o.plantG.rotation.x += ((thirsty ? 0.35 : 0) - o.plantG.rotation.x) * Math.min(1, dt * 3);
    o.wet.material.opacity = p.m * 0.5;
    if (o.head) {
      o.head.rotation.y = az; // 꽃은 늘 나를 바라봐요
      if (o.bloomAnim !== undefined) {
        o.bloomAnim = Math.min(1, o.bloomAnim + dt * 1.1);
        const x = o.bloomAnim; o.head.scale.setScalar(Math.max(0.01, x === 1 ? 1 : 1 - Math.pow(2, -9 * x) * Math.cos(x * 9)));
        if (x === 1) delete o.bloomAnim;
      }
    }
  });
  // 물뿌리개
  canTilt += ((watering ? 1 : 0) - canTilt) * Math.min(1, dt * 8);
  can.visible = canTilt > 0.02;
  if (can.visible) {
    can.position.lerp(canTarget.clone().add(new THREE.Vector3(0.2, 0.42, 0.05)), Math.min(1, dt * 14));
    can.rotation.z = canTilt * 0.75;
    if (watering) {
      for (let q = 0; q < 3; q++) {
        const d = new THREE.Mesh(dropGeo, dropMat);
        d.position.copy(can.localToWorld(new THREE.Vector3(-0.19, 0.085, (Math.random() - 0.5) * 0.04)));
        d.userData.v = new THREE.Vector3(-0.2 + Math.random() * 0.1, 0, (Math.random() - 0.5) * 0.06);
        scene.add(d); drops.push(d);
      }
      objs.forEach(o => { if (Math.hypot(o.p.x - canTarget.x, o.p.z - canTarget.z) < 0.32) waterPlant(o, dt); });
    }
  }
  for (let q = drops.length - 1; q >= 0; q--) {
    const d = drops[q]; d.userData.v.y -= 3.4 * dt; d.position.addScaledVector(d.userData.v, dt);
    if (d.position.y < SOIL_Y) { scene.remove(d); drops.splice(q, 1); }
  }
  // 말풍선
  if (bubbleObj) {
    const [x, y] = screenOf(bubbleObj.group.position.clone().add(new THREE.Vector3(0, bubbleObj.h * PS + 0.1, 0)));
    const b = $('bubble'); b.style.left = x + 'px'; b.style.top = y + 'px';
    bubbleTime -= dt; if (bubbleTime < 0) hideBubble();
  }
  // 1초마다 자라고 마르기
  acc += dt;
  if (acc >= 1) {
    const si = sunInfo(state.sun);
    objs.forEach(o => { tick(o.p, acc, si); refreshPlant(o); });
    acc = 0; state.t = Date.now(); saveState(state);
    if (bubbleObj) renderBubble();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------- 시작 ----------
applySun();
const d0 = frame();
camera.position.set(0, controls.target.y + d0 * Math.cos(0.95), d0 * Math.sin(0.95));
state.plants.forEach(p => { if (byId[p.id]) addObj(p, false); });
updateDexCount(); setHint();
Promise.all(objs.filter(o => o.p.g >= 1).map(o => getModel(byId[o.p.id]).catch(() => {}))).then(() => {
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 600);
  loop();
  if (giftId) queueReveal(byId[giftId], 'gift');
  objs.forEach(o => { if (o.p.g >= 1 && !state.owned.includes(o.p.id)) { state.owned.push(o.p.id); queueReveal(byId[o.p.id], 'new'); } });
  saveState(state); updateDexCount();
  setTimeout(() => FLOWERS.forEach(f => getModel(f).catch(() => {})), 1500);
});
</script>
